[server]
headless = true
address = "0.0.0.0"
port = 8501
maxUploadSize = 15          # MB, matches MAX_IMAGE_BYTES
enableXsrfProtection = true
fileWatcherType = "none"    # production: no source reloading

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#ef4056"
