# HTTPS reverse proxy in front of Streamlit. Mounted by deploy/compose.server.yml.
server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1d;

    # Plain HTTP sent to the TLS port: redirect instead of nginx's 400 page.
    error_page 497 =301 https://$host:$server_port$request_uri;

    client_max_body_size 16m;          # image uploads (MAX_IMAGE_BYTES = 15 MB)
    include /etc/nginx/snippets/security-headers.inc;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location / {
        proxy_pass http://app:8501;
        proxy_http_version 1.1;
        # Streamlit talks to the browser over a WebSocket (/_stcore/stream).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
