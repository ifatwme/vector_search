[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "persian-vector-search"
version = "1.0.0"
description = "Persian multimodal product search (CLIPfa + Weaviate) with a local LLM shopping assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "weaviate-client==4.24.1",
  "Pillow==13.0.0",
  "torch==2.15.0",
  "transformers==4.57.6",
  "streamlit==1.67.0",
  "numpy==2.5.4",
  "requests==2.34.2",
]

[project.scripts]
vector-search = "vector_search.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.4", "PyYAML==6.0.3", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/vector_search"]

[tool.uv]
required-version = ">=0.9.0"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers -p no:cacheprovider"
filterwarnings = ["ignore:The httpx module is deprecated"]
markers = ["integration: requires a running Weaviate", "models: downloads/runs real CLIPfa models"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["src/**/*.py", "tests/**/*.py", "app.py", "scripts/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["vector_search"]
omit = ["*/ui.py"]

[tool.coverage.report]
show_missing = true
